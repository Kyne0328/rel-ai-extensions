name: Sync OfficeCLI catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync OfficeCLI catalog metadata
        run: node scripts/sync-officecli-catalog.mjs --write

      - name: Validate catalog
        run: npm test

      - name: Open or refresh catalog pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- catalog.json; then
            echo "OfficeCLI catalog is already current."
            exit 0
          fi

          version="$(node -p "JSON.parse(require('fs').readFileSync('catalog.json','utf8')).extensions.find(e => e.id === 'officecli').version")"
          branch="automation/officecli-catalog-${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add catalog.json
          git commit -m "chore: sync OfficeCLI catalog to ${version}"
          git push --force-with-lease origin "HEAD:$branch"

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create               --base main               --head "$branch"               --title "chore: sync OfficeCLI catalog to ${version}"               --body "Automated catalog synchronization from the merged OfficeCLI extension manifest. Normal catalog validation still runs before the PR is opened."
          else
            echo "Updated existing PR #$existing."
          fi
